name: Regenerate corpus

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        run: make corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Open PR with regenerated data
        uses: peter-evans/create-pull-request@v7
        with:
          branch: regenerate-corpus
          title: 'Regenerate puzzle corpus'
          commit-message: 'Regenerate puzzle corpus'
          body: |
            Automated corpus regeneration via `make corpus`
            (workflow_dispatch). Review the data diff before merging; CI's
            data-invariants job re-verifies every level.
          add-paths: data/
